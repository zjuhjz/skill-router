[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skill-router"
dynamic = ["version"]
description = "Platform-agnostic skillcall router: discover Skills, invoke a capability, fall back, and score health."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "skill-router contributors" }]
keywords = ["skillcall", "mcp", "skills", "router"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "jsonschema>=4.21",
  "mcp>=2,<3",
  "pyyaml>=6",
]

[project.optional-dependencies]
skills = ["requests>=2.31", "yt-dlp>=2024.8.6"]
# faster-whisper 1.2.1 still passes metadata_errors to av.open; PyAV 19 removed it.
asr = ["faster-whisper>=1.1.0", "av>=11,<19", "zhconv>=1.4.2"]
dev = ["pytest>=8"]

[project.scripts]
skillrouter = "skillrouter.cli:main"

[tool.hatch.version]
path = "src/skillrouter/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/skillrouter"]

[tool.hatch.build.targets.wheel.force-include]
"registry" = "skillrouter/bundled_registry"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "live: network tests against real skills; run with pytest -m live",
]
addopts = "-m 'not live'"
