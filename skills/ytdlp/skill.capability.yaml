skillcall: "0.1"
id: example.ytdlp
version: 0.3.4
name: yt-dlp
author:
  name: skill-router examples
license: MIT
provides:
  - capability: video.download@1
    platforms: [douyin, bilibili, xiaohongshu, weibo]
    entrypoint:
      type: command
      command: ["$PYTHON", "entry.py", "download"]
    timeout_s: 180
    requires:
      optional_env: [YTDLP_COOKIES, XHS_COOKIES]
      python: ["yt-dlp"]
      network: true
    cost: free
    side_effects: [writes_files, network]
    health_check:
      use_platform_canaries: true
      expect:
        - "exists(output.meta.id)"
        - "output.files[0].size_bytes > 100000"
      interval_h: 24
  - capability: video.resolve@1
    platforms: [douyin, bilibili, xiaohongshu, weibo]
    metadata: basic
    entrypoint:
      type: command
      command: ["$PYTHON", "entry.py", "resolve"]
    timeout_s: 60
    requires:
      optional_env: [YTDLP_COOKIES, XHS_COOKIES]
      python: ["yt-dlp"]
      network: true
    cost: free
    side_effects: [network]
    health_check:
      use_platform_canaries: true
      expect:
        - "len(output.media) >= 1"
      interval_h: 24
