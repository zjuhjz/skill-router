skillcall: "0.1"
id: example.xiaohongshu-web
version: 0.3.7
name: 小红书笔记页
author:
  name: skill-router examples
license: MIT
provides:
  - capability: video.download@1
    platforms: [xiaohongshu]
    priority: 10
    url_patterns:
      - 'https?://([a-z0-9-]+\.)?xiaohongshu\.com/'
      - 'https?://([a-z0-9-]+\.)?xhslink\.com/'
      - 'https?://([a-z0-9-]+\.)?xhslink\.cn/'
    entrypoint:
      type: command
      command: ["$PYTHON", "entry.py", "download"]
    timeout_s: 180
    requires:
      optional_env: [XHS_COOKIES]
      python: ["requests>=2.31"]
      network: true
    cost: free
    side_effects: [writes_files, network]
    health_check:
      use_platform_canaries: true
      expect:
        - "output.meta.platform == 'xiaohongshu'"
        - "output.files[0].size_bytes > 10000"
      interval_h: 24
  - capability: video.resolve@1
    platforms: [xiaohongshu]
    metadata: rich
    priority: 10
    url_patterns:
      - 'https?://([a-z0-9-]+\.)?xiaohongshu\.com/'
      - 'https?://([a-z0-9-]+\.)?xhslink\.com/'
      - 'https?://([a-z0-9-]+\.)?xhslink\.cn/'
    entrypoint:
      type: command
      command: ["$PYTHON", "entry.py", "resolve"]
    timeout_s: 40
    requires:
      optional_env: [XHS_COOKIES]
      python: ["requests>=2.31"]
      network: true
    cost: free
    side_effects: [network]
    health_check:
      use_platform_canaries: true
      expect:
        - "output.meta.platform == 'xiaohongshu'"
        - "len(output.media) >= 1"
      interval_h: 24
  - capability: image.download@1
    platforms: [xiaohongshu]
    url_patterns:
      - 'https?://([a-z0-9-]+\.)?xiaohongshu\.com/'
      - 'https?://([a-z0-9-]+\.)?xhslink\.com/'
      - 'https?://([a-z0-9-]+\.)?xhslink\.cn/'
    entrypoint:
      type: command
      command: ["$PYTHON", "entry.py", "images"]
    timeout_s: 180
    requires:
      optional_env: [XHS_COOKIES]
      python: ["requests>=2.31"]
      network: true
    cost: free
    side_effects: [writes_files, network]
    health_check:
      enabled: false
