skillcall: "0.1"
id: example.kuaishou-web
version: 0.3.0
name: 快手分享页
author:
  name: skill-router examples
license: MIT
provides:
  - capability: video.download@1
    platforms: [kuaishou]
    url_patterns:
      - 'https?://([a-z0-9-]+\.)?(kuaishou\.com|gifshow\.com|chenzhongtech\.com)/'
    entrypoint:
      type: command
      command: ["$PYTHON", "entry.py", "download"]
    timeout_s: 180
    requires:
      optional_env: [KUAISHOU_COOKIES]
      python: ["requests>=2.31"]
      network: true
    cost: free
    side_effects: [writes_files, network]
    health_check:
      use_platform_canaries: true
      expect:
        - "output.meta.platform == 'kuaishou'"
        - "output.files[0].size_bytes > 10000"
      interval_h: 24
  - capability: video.resolve@1
    platforms: [kuaishou]
    metadata: rich
    url_patterns:
      - 'https?://([a-z0-9-]+\.)?(kuaishou\.com|gifshow\.com|chenzhongtech\.com)/'
    entrypoint:
      type: command
      command: ["$PYTHON", "entry.py", "resolve"]
    timeout_s: 40
    requires:
      optional_env: [KUAISHOU_COOKIES]
      python: ["requests>=2.31"]
      network: true
    cost: free
    side_effects: [network]
    health_check:
      use_platform_canaries: true
      expect:
        - "output.meta.platform == 'kuaishou'"
        - "len(output.media) >= 1"
      interval_h: 24
