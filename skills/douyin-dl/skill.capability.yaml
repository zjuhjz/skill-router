skillcall: "0.1"
id: example.douyin-dl
version: 0.2.0
name: 抖音下载（用户脚本的 iesdouyin 适配）
author:
  name: skill-router examples
license: MIT
provides:
  - capability: video.download@1
    platforms: [douyin]
    url_patterns:
      - 'https?://([a-z0-9-]+\.)?douyin\.com/'
      - 'https?://([a-z0-9-]+\.)?iesdouyin\.com/'
    entrypoint:
      type: command
      command: ["$PYTHON", "skillcall_entry.py", "download"]
    timeout_s: 120
    requires:
      env: []
      optional_env: [DOUYIN_COOKIES]
      binaries: []
      python: ["requests>=2.31"]
      network: true
    cost: free
    side_effects: [writes_files, network]
    health_check:
      use_platform_canaries: true
      expect:
        - "output.meta.platform == 'douyin'"
        - "output.files[0].size_bytes > 100000"
      interval_h: 12
  - capability: video.resolve@1
    platforms: [douyin]
    metadata: rich
    url_patterns:
      - 'https?://([a-z0-9-]+\.)?douyin\.com/'
      - 'https?://([a-z0-9-]+\.)?iesdouyin\.com/'
    entrypoint:
      type: command
      command: ["$PYTHON", "skillcall_entry.py", "resolve"]
    timeout_s: 40
    requires:
      optional_env: [DOUYIN_COOKIES]
      network: true
    cost: free
    side_effects: [network]
    health_check:
      use_platform_canaries: true
      expect:
        - "len(output.media) >= 1"
        - "output.meta.platform == 'douyin'"
      interval_h: 12
