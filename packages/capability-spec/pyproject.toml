[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skillcall-spec"
version = "0.4.0"
description = "Vendor-neutral capability contracts for AI skills and tools."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.21", "pyyaml>=6"]

[project.scripts]
skillcall-spec = "skillcall_spec.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/skillcall_spec"]

[tool.hatch.build.targets.wheel.force-include]
"registry" = "skillcall_spec/registry"
"schemas" = "skillcall_spec/schemas"
