[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skill-eval"
version = "0.1.0"
description = "Deterministic evaluation runner for AI skills and capabilities."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.21",
  "mcp>=2,<3",
  "pyyaml>=6",
  "skillcall-spec>=0.4,<0.5",
]

[project.scripts]
skill-eval = "skilleval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/skilleval"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "skilleval/schemas"
"benchmarks" = "skilleval/benchmarks"
"implementations" = "skilleval/implementations"
