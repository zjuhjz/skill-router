name: Run skill-eval
description: Evaluate a skillcall implementation and publish JSON, Markdown, and JUnit evidence.

inputs:
  implementation:
    description: Path to the implementation directory.
    required: true
  suite:
    description: Path to the evaluation suite YAML file.
    required: true
  mode:
    description: Expected suite mode (offline or live).
    required: false
    default: offline
  output-dir:
    description: Directory for generated reports.
    required: false
    default: skill-eval-report
  artifact-name:
    description: Name of the uploaded report artifact.
    required: false
    default: skill-eval-report
  upload-report:
    description: Upload generated reports as a workflow artifact.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install capability-spec and skill-eval
      shell: bash
      run: >-
        python -m pip install
        "$GITHUB_ACTION_PATH/../capability-spec"
        "$GITHUB_ACTION_PATH"

    - name: Run evaluation
      shell: bash
      run: |
        mkdir -p "${{ inputs.output-dir }}"
        python -m skilleval run "${{ inputs.implementation }}" \
          --suite "${{ inputs.suite }}" \
          --mode "${{ inputs.mode }}" \
          --json "${{ inputs.output-dir }}/report.json" \
          --markdown "${{ inputs.output-dir }}/report.md" \
          --junit "${{ inputs.output-dir }}/report.xml"

    - name: Upload evaluation evidence
      if: ${{ inputs.upload-report == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.output-dir }}
        if-no-files-found: error
